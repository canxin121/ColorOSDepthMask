name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.0
        required: true
        default: v1.0.0
      source_ref:
        description: Private source branch, tag or commit
        required: true
        default: main
      prerelease:
        description: Mark as prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: canxin121/ColorOSDepthMask-Source
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Restore release signing key
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/depthmask-release.jks"
          chmod 600 "$RUNNER_TEMP/depthmask-release.jks"

      - name: Build release APK
        working-directory: source
        env:
          DEPTHMASK_KEYSTORE_PATH: ${{ runner.temp }}/depthmask-release.jks
          DEPTHMASK_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          DEPTHMASK_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DEPTHMASK_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Validate artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          test "$(unzip -p "$APK" assets/xposed_init | tr -d '\r\n')" = 'dev.coloros.depthmask.hook.DepthMaskHook'
          NAME="ColorOSDepthMask-${{ inputs.tag }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ColorOSDepthMask ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.apk }}
