name: Build release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.1
        required: true
        default: v0.1.1
      source_ref:
        description: Private source branch, tag or commit
        required: true
        default: main
      prerelease:
        description: Mark as prerelease
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check private source credential
        shell: bash
        env:
          SOURCE_DEPLOY_KEY: ${{ secrets.SOURCE_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SOURCE_DEPLOY_KEY" ]; then
            echo "::error::Missing SOURCE_DEPLOY_KEY repository secret. Add the private deploy key for canxin121/ColorOSDepthMask-Source."
            exit 1
          fi

      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: canxin121/ColorOSDepthMask-Source
          ref: ${{ inputs.source_ref }}
          ssh-key: ${{ secrets.SOURCE_DEPLOY_KEY }}
          path: source

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: source/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-37.0" \
            "build-tools;37.0.0"

      - name: Build release APK
        working-directory: source
        run: |
          set -euo pipefail
          chmod +x gradlew
          test -f signing/release.jks
          test -f signing/release.properties
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Validate artifact
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          APK='source/app/build/outputs/apk/release/app-release.apk'
          test -f "$APK"
          test "$(unzip -p "$APK" assets/xposed_init | tr -d '\r\n')" = 'dev.coloros.depthmask.hook.DepthMaskHook'
          AAPT="$ANDROID_HOME/build-tools/37.0.0/aapt"
          VERSION_NAME="$($AAPT dump badging "$APK" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"
          EXPECTED_VERSION="${{ inputs.tag }}"
          EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          test -n "$VERSION_NAME"
          if [ "$VERSION_NAME" != "$EXPECTED_VERSION" ]; then
            echo "::error::APK versionName $VERSION_NAME does not match release tag ${{ inputs.tag }}"
            exit 1
          fi
          NAME="ColorOSDepthMask-${{ inputs.tag }}.apk"
          cp "$APK" "$NAME"
          sha256sum "$NAME"
          echo "apk=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ColorOSDepthMask ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: ${{ steps.artifact.outputs.apk }}
